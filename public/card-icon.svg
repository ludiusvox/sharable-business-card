<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Metallic Edge & Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Metallic Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- NFC Signal Gradient -->
    <linearGradient id="nfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Mesh Glow -->
    <radialGradient id="meshGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Icon Background Container (Rounded Super-ellipse) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0b1326" />

  <!-- Main Smart Business Card -->
  <g transform="translate(48, 116)">
    <!-- Card Shadow -->
    <rect x="8" y="14" width="400" height="252" rx="24" fill="#000000" opacity="0.45" filter="blur(10px)" />

    <!-- Card Base -->
    <rect x="0" y="0" width="416" height="262" rx="24" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="3" />

    <!-- Ambient Glow inside card -->
    <rect x="0" y="0" width="416" height="262" rx="24" fill="url(#meshGlow)" />

    <!-- Contactless NFC Waves (Top Right) -->
    <g transform="translate(330, 32)" stroke="url(#nfcGrad)" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M 0 32 A 32 32 0 0 1 32 0" opacity="0.4" />
      <path d="M 0 22 A 22 22 0 0 1 22 0" opacity="0.7" />
      <path d="M 0 12 A 12 12 0 0 1 12 0" opacity="1.0" />
      <circle cx="2" cy="30" r="2.5" fill="#38bdf8" stroke="none" />
    </g>

    <!-- Smart EMV Chip (Top Left) -->
    <g transform="translate(36, 36)">
      <rect x="0" y="0" width="54" height="40" rx="8" fill="url(#chipGrad)" stroke="#fef08a" stroke-width="1" />
      <path d="M 0 14 H 54 M 0 26 H 54 M 20 0 V 40 M 34 0 V 40" stroke="#b45309" stroke-width="1.5" opacity="0.6" fill="none" />
      <rect x="18" y="12" width="18" height="16" rx="3" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Business Card Holder Identity Details (Center/Bottom) -->
    <!-- Verified Badge -->
    <g transform="translate(36, 108)">
      <circle cx="12" cy="12" r="12" fill="#34d399" />
      <path d="M 7 12 L 10.5 15.5 L 17 8.5" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="32" y="16" fill="#f8fafc" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="16" letter-spacing="0.5">SOVEREIGN ID</text>
    </g>

    <!-- Person / Identity Name Line -->
    <rect x="36" y="142" width="220" height="14" rx="7" fill="#e2e8f0" />
    <rect x="36" y="166" width="140" height="10" rx="5" fill="#818cf8" opacity="0.9" />

    <!-- Card Serial / Footer Ledger Line -->
    <line x1="36" y1="212" x2="380" y2="212" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="36" y="234" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" letter-spacing="1">PASS SERIAL: SOV-9428-SEC</text>
    <rect x="330" y="222" width="50" height="14" rx="4" fill="#38bdf8" opacity="0.2" />
    <text x="337" y="233" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800">NFC TAP</text>
  </g>
</svg>
